"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

file_include_globs = """
.env*
apps/web/.dev.vars
"""

[scripts]
setup = """
if [ ! -f apps/web/.dev.vars ]; then
  cp apps/web/.dev.vars.example apps/web/.dev.vars
fi
pnpm install --frozen-lockfile
pnpm seed
"""
run_mode = "concurrent"

[scripts.run.web]
available_in = ["local"]
command = "PORT=$CONDUCTOR_PORT vp run web#dev"
icon = "cloud"
